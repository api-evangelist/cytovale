name: Cytovale
description: 'Cytovale is a San Francisco-based medical diagnostics company that develops
  early-detection technology for sepsis. Its flagship product, IntelliSep, is the first
  and only FDA-cleared in vitro diagnostic test for sepsis: it uses microfluidics, high-speed
  video, and computer-vision algorithms to measure the biophysical rigidity of tens of
  thousands of white blood cells, detecting the immune activation that signals sepsis risk
  and returning a risk stratification in roughly eight minutes. The test runs on the
  Cytovale System medical device in emergency-department settings. Cytovale is venture-backed
  by Norwest Venture Partners, Sands Capital, and the Global Health Investment Corporation.
  The company operates as a clinical/diagnostics device maker and does not currently publish
  a public developer API, SDK, or API documentation surface.'
